<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />

  <title>FEEDBACK — Live the Scene</title>
  <meta name="description" content="Tu radar social de fiestas en tiempo real. Publica, califica y vive la escena." />
  <meta name="theme-color" content="#0A0A0F" />

  <!-- Favicons (browser tabs) -->
  <link rel="icon" type="image/png" sizes="192x192" href="/logo-192.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="/logo-512.png" />
  <link rel="shortcut icon" type="image/png" href="/logo-192.png" />

  <!-- iOS: "Add to Home Screen" icon + standalone behavior -->
  <link rel="apple-touch-icon" sizes="180x180" href="/logo-180.png" />
  <link rel="apple-touch-icon" sizes="192x192" href="/logo-192.png" />
  <link rel="apple-touch-icon" sizes="512x512" href="/logo-512.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="FEEDBACK" />

  <!-- Android / Chrome: PWA manifest -->
  <link rel="manifest" href="/manifest.json" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="application-name" content="FEEDBACK" />

  <!-- Open Graph (Facebook, LinkedIn, WhatsApp previews) -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="FEEDBACK" />
  <meta property="og:title" content="FEEDBACK — Live the Scene" />
  <meta property="og:description" content="Tu radar social de fiestas en tiempo real. Publica, califica y vive la escena." />
  <meta property="og:url" content="https://partyrate.site" />
  <meta property="og:image" content="https://partyrate.site/logo.png" />
  <meta property="og:image:alt" content="FEEDBACK logo" />
  <meta property="og:locale" content="es_CO" />

  <!-- Twitter / X cards -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="FEEDBACK — Live the Scene" />
  <meta name="twitter:description" content="Tu radar social de fiestas en tiempo real. Publica, califica y vive la escena." />
  <meta name="twitter:image" content="https://partyrate.site/logo.png" />

  <!-- Canonical -->
  <link rel="canonical" href="https://partyrate.site" />

  <!-- Preconnect al backend: el TLS+DNS de Supabase se negocia en
       paralelo con el parseo del bundle — la primera query de
       hidratación sale sin pagar el handshake. -->
  <link rel="preconnect" href="https://rayjzdxtczvjyxujkmne.supabase.co" crossorigin>
  <link rel="dns-prefetch" href="https://rayjzdxtczvjyxujkmne.supabase.co">

  <!-- Fonts: Poppins AUTO-HOSPEDADA (subset latino, public/fonts/*.woff2,
       @font-face al inicio de main.css). Antes venía de Google Fonts como
       <link> render-blocking cross-origin — en redes lentas el primer
       pintado esperaba ese CSS y el service worker no podía cachearlo.
       Body usa los pesos livianos, los títulos display los pesados. -->
  <link rel="preload" href="/fonts/poppins-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/poppins-700.woff2" as="font" type="font/woff2" crossorigin>

  <link rel="stylesheet" href="/src/styles/main.css" />
</head>
<body>
  <div id="app"></div>

  <!-- Persistent bottom navigation. Lives OUTSIDE #app so router page
       swaps (innerHTML rewrites) don't recreate it on every render —
       previously each refresh wiped + rebuilt the nav, visible as a
       full-bar flicker. mountBottomNav() in main.js fills this on boot
       and setBottomNav(tab) updates only the active state from then on.
       Starts `hidden` so login / onboarding don't show it accidentally. -->
  <nav class="bottom-nav" id="bottom-nav" hidden aria-label="Navegación principal"></nav>

  <!-- =====================================================================
       Lava Lamp / Metaballs Background — WebGL canvas
       =====================================================================
       LOCKED. Do not replace with <div>s, <svg>s, foreignObject, an iframe,
       or anything else. The full design rationale (incl. four previous
       rejected architectures and the iOS/WebKit bugs that killed them)
       lives at the top of src/utils/lava-lamp.js — read it before
       editing any of:
         * this <canvas> element
         * #lava-canvas in src/styles/main.css
         * the initLavaLamp() call in src/main.js
       Changing one without the others will break the goo on at least
       one device class.
       The canvas MUST be a direct child of <body> (sibling of #app), MUST
       have id="lava-canvas", and MUST NOT set width/height attributes
       here — the renderer sizes the drawing buffer to the actual CSS box
       on every resize. The aria-hidden tag is intentional: this is
       decorative, not content. -->
  <canvas id="lava-canvas" aria-hidden="true"></canvas>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
